<script>
(function () {
  const themeKey = 'td-color-theme';

  function normalizeTheme(value) {
    if (value === 'system') {
      return 'auto';
    }
    if (value === 'light' || value === 'dark' || value === 'auto') {
      return value;
    }
    return null;
  }

  function isStorageAccessError(error) {
    return (
      error instanceof DOMException &&
      (error.name === 'SecurityError' || error.name === 'QuotaExceededError')
    );
  }

  function getRawStoredTheme() {
    try {
      return localStorage.getItem(themeKey);
    } catch (error) {
      if (!isStorageAccessError(error)) {
        throw error;
      }
      return null;
    }
  }

  function getStoredTheme() {
    try {
      return normalizeTheme(getRawStoredTheme());
    } catch (error) {
      if (!isStorageAccessError(error)) {
        throw error;
      }
      return null;
    }
  }

  function setStoredTheme(theme) {
    try {
      localStorage.setItem(themeKey, theme);
    } catch (error) {
      if (!isStorageAccessError(error)) {
        throw error;
      }
      // storage unavailable; theme will not persist
    }
  }

  function clearStoredTheme() {
    try {
      localStorage.removeItem(themeKey);
    } catch (error) {
      if (!isStorageAccessError(error)) {
        throw error;
      }
    }
  }

  function preferredTheme() {
    const stored = getStoredTheme();
    if (stored) {
      return stored;
    }

    const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
    return prefersDark ? 'dark' : 'light';
  }

  function applyTheme(theme) {
    let resolved = theme;

    if (theme === 'auto') {
      const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
      resolved = prefersDark ? 'dark' : 'light';
    }

    document.documentElement.dataset.bsTheme = resolved;
  }

  function updateThemeUI(theme) {
    const themeSwitcher = document.querySelector('#bd-theme');
    if (!themeSwitcher) {
      return;
    }

    const activeThemeIcon = document.querySelector('.theme-icon-active use');
    const activeThemeButton =
      document.querySelector('[data-bs-theme-value="' + theme + '"]') ||
      document.querySelector('[data-bs-theme-value="auto"]');

    if (!activeThemeButton) {
      return;
    }

    document.querySelectorAll('[data-bs-theme-value]').forEach(function (element) {
      element.classList.remove('active');
      element.setAttribute('aria-pressed', 'false');
    });

    activeThemeButton.classList.add('active');
    activeThemeButton.setAttribute('aria-pressed', 'true');

    if (activeThemeIcon) {
      const iconUse = activeThemeButton.querySelector('svg use');
      const href =
        iconUse?.getAttribute('href') ||
        iconUse?.getAttribute('xlink:href');

      activeThemeIcon.setAttribute('href', href || '');
    }

    themeSwitcher.setAttribute('aria-label', 'Toggle theme (' + activeThemeButton.dataset.bsThemeValue + ')');
  }

  function installThemeHandlers() {
    const rawStored = getRawStoredTheme();
    const normalized = normalizeTheme(rawStored);

    if (rawStored === 'system') {
      setStoredTheme('auto');
    } else if (rawStored && !normalized) {
      clearStoredTheme();
    }

    const currentTheme = preferredTheme();
    applyTheme(currentTheme);
    updateThemeUI(currentTheme);

    document.querySelectorAll('[data-bs-theme-value]').forEach(function (toggle) {
      if (toggle.dataset.tdThemeBound === 'true') {
        return;
      }
      toggle.dataset.tdThemeBound = 'true';

      toggle.addEventListener('click', function () {
        const chosen = normalizeTheme(toggle.dataset.bsThemeValue) || 'auto';
        setStoredTheme(chosen);
        applyTheme(chosen);
        updateThemeUI(chosen);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', installThemeHandlers);
  } else {
    installThemeHandlers();
  }

  globalThis.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    const stored = getStoredTheme();
    if (!stored || stored === 'auto') {
      applyTheme('auto');
      updateThemeUI('auto');
    }
  });
})();
</script>
